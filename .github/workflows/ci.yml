name: Continuous Integration

on: push

jobs:
  build_test:
    name: Build and Run Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Tests
        run: npm run test:coverage -- --runInBand
      - name: Run webR corpus (golden fixtures under real R)
        run: npm run test:corpus
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: jest
          token: ${{ secrets.CODECOV_TOKEN }}
  s3-deploy:
    name: S3 Deploy
    needs:
      - build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install Dependencies
        run: npm ci
      # Self-hosted webR package library image (plan Unit 9): one cacheable
      # file replacing per-package CDN downloads on school networks. The rwasm
      # toolchain must match the webr npm version (ABI-locked); cache the
      # built image keyed on that version + package list.
      - name: Resolve webR version
        id: webr-version
        run: echo "version=$(node -p "require('webr/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache library image
        id: library-image-cache
        uses: actions/cache@v4
        with:
          path: dist/webr-library
          key: webr-library-${{ steps.webr-version.outputs.version }}-${{ hashFiles('scripts/build-library-image/build.R') }}
      - uses: r-lib/actions/setup-r@v2
        if: steps.library-image-cache.outputs.cache-hit != 'true'
        with:
          use-public-rspm: true
      - name: Build library image
        if: steps.library-image-cache.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'install.packages("rwasm", repos = c("https://r-wasm.r-universe.dev", "https://cloud.r-project.org"))'
          Rscript scripts/build-library-image/build.R dist/webr-library
      - uses: concord-consortium/s3-deploy-action@v1
        id: s3-deploy
        with:
          bucket: models-resources
          prefix: codap-r-sidebar
          awsAccessKeyId: ${{ secrets.AWS_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          deployRunUrl: https://codap3.concord.org/branch/main/?di=https://models-resources.concord.org/codap-r-sidebar/__deployPath__/index.html
          # Parameters to GHActions have to be strings, so a regular yaml array cannot
          # be used. Instead the `|` turns the following lines into a string
          topBranches: |
            ["master"]
